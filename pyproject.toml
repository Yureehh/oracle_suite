[project]
name = "strixia-workspace"
version = "0.1.0"
description = "Development workspace for Strixia"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python/strixia_core", "packages/python/strixia_agon"]
exclude = ["scripts/pokemon_foundation"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages/python/strixia_core/tests", "packages/python/strixia_agon/tests", "apps/worker/tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/python/strixia_core/src", "packages/python/strixia_agon/src", "packages/python/strixia_core/tests", "packages/python/strixia_agon/tests", "scripts/pokemon_battle.py", "apps/worker/local.py", "apps/worker/tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
