name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.5"
      - name: Install Python
        run: uv python install 3.12
      - name: Install Node for the pinned simulator
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.0.0"
      - name: Prepare pinned simulator
        run: sh scripts/pokemon_foundation/prepare.sh --engine-only
      - name: Install locked workspace
        run: uv sync --locked --all-packages
      - name: Check pre-commit hooks (including Ruff lint and format)
        run: uv run --locked --all-packages pre-commit run --all-files --show-diff-on-failure
      - name: Check types
        run: uv run --locked --all-packages mypy
      - name: Test
        run: uv run --locked --all-packages pytest
